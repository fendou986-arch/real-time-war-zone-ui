name: Update public news feed

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GDELT articles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          url='https://api.gdeltproject.org/api/v2/doc/doc?query=%28war%20OR%20conflict%20OR%20missile%20OR%20airstrike%29&mode=artlist&format=json&maxrecords=12&sort=HybridRel&timespan=24h'
          if curl --fail --silent --show-error --retry 2 --connect-timeout 15 --max-time 45 "$url" -o /tmp/gdelt.json \
            && jq -e '.articles | type == "array"' /tmp/gdelt.json >/dev/null; then
            jq --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{generatedAt: $generatedAt, source: "gdelt", stale: false, articles: [.articles[] | select(.title and (.url // .url_mobile)) | {title, url: (.url // .url_mobile), domain, seendate}]}' \
              /tmp/gdelt.json > data/news.json
          else
            python - <<'PY'
            from datetime import datetime, timezone
            from urllib.request import Request, urlopen
            from xml.etree import ElementTree
            import json

            feeds = [
                ("BBC", "https://feeds.bbci.co.uk/news/world/rss.xml"),
                ("DW", "https://rss.dw.com/rdf/rss-en-world"),
                ("Al Jazeera", "https://www.aljazeera.com/xml/rss/all.xml"),
            ]
            articles = []
            for domain, url in feeds:
                try:
                    request = Request(url, headers={"User-Agent": "war-zone-dashboard/1.0"})
                    root = ElementTree.fromstring(urlopen(request, timeout=20).read())
                    for item in root.findall(".//item")[:5]:
                        title = (item.findtext("title") or "").strip()
                        link = (item.findtext("link") or "").strip()
                        date = (item.findtext("pubDate") or "").strip()
                        if title and link:
                            articles.append({
                                "title": title, "url": link, "domain": domain,
                                "seendate": date or datetime.now(timezone.utc).isoformat()
                            })
                except Exception:
                    continue
            if not articles:
                raise SystemExit("All RSS feeds unavailable")
            with open("data/news.json", "w", encoding="utf-8") as output:
                json.dump({
                    "generatedAt": datetime.now(timezone.utc).isoformat(),
                    "source": "rss", "stale": False, "articles": articles[:12]
                }, output, ensure_ascii=False, indent=2)
            PY
          fi
      - name: Publish updated feed
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "News feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Update public news feed"
          git push
